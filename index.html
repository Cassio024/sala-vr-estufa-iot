<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala VR - Estufa IoT</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; font-family: sans-serif; }
    #app canvas { display: block; }
    /* Botão "Enter VR" gerado pelo three.js */
    #app > button, body > button {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border: 1px solid #fff; border-radius: 6px;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 16px; cursor: pointer;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
